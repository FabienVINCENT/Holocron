name: Release

# Triggers:
# - push a version tag:  git tag v0.2.0 && git push origin v0.2.0
# - bump the VERSION file on a branch (auto-release.yml calls this workflow)
# - Actions → Release → Run workflow (manual, tag as input)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.3)"
        required: true
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

permissions:
  contents: write

env:
  SPARKLE_VERSION: "2.6.4"

jobs:
  release:
    name: Build, sign & publish
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"   # e.g. v0.1.3
          VERSION="${TAG#v}"                           # -> 0.1.3
          echo "tag=$TAG"                   >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"           >> "$GITHUB_OUTPUT"
          echo "build=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Install tooling
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build Release .app
        run: |
          set -euo pipefail
          xcodebuild build \
            -project Holocron.xcodeproj \
            -scheme Holocron \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build }}" \
            CODE_SIGNING_ALLOWED=NO
          # NOTE (Apple notarization TODO): to ship a Developer ID build,
          # switch to a real signing identity, then add `codesign --options
          # runtime` + `xcrun notarytool submit ... --wait` + stapling here.

      - name: Package .dmg
        id: dmg
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release/Holocron.app"
          STAGING="dmg-staging"
          DMG="Holocron-${{ steps.version.outputs.version }}.dmg"
          rm -rf "$STAGING" && mkdir -p "$STAGING"
          cp -R "$APP" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create -volname "Holocron" -srcfolder "$STAGING" -ov -format UDZO "$DMG"
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"

      - name: Fetch Sparkle signing tool
        run: |
          set -euo pipefail
          curl -fsSL -o sparkle.tar.xz \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          mkdir -p sparkle && tar -xf sparkle.tar.xz -C sparkle

      - name: Sign the .dmg with the EdDSA key
        id: sign
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SPARKLE_PRIVATE_KEY:-}" ]; then
            echo "::error::Secret SPARKLE_PRIVATE_KEY is not set (same key as r2-git2 — see docs/RELEASE.md)."
            exit 1
          fi
          printf '%s' "$SPARKLE_PRIVATE_KEY" > sparkle_private_key
          SIG_LINE="$(./sparkle/bin/sign_update "${{ steps.dmg.outputs.dmg }}" -f sparkle_private_key)"
          rm -f sparkle_private_key
          echo "Signature line: $SIG_LINE"
          ED_SIG="$(echo "$SIG_LINE" | sed -E 's/.*sparkle:edSignature="([^"]+)".*/\1/')"
          LENGTH="$(echo "$SIG_LINE" | sed -E 's/.*length="([0-9]+)".*/\1/')"
          echo "edSignature=$ED_SIG" >> "$GITHUB_OUTPUT"
          echo "length=$LENGTH"      >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          notes_for() {
            awk -v prefix="## [$1]" '
              index($0, prefix) == 1 { flag = 1; next }
              /^## / { if (flag) exit }
              flag { print }
            ' CHANGELOG.md
          }
          NOTES="$(notes_for "$VERSION")"
          [ -n "$(printf %s "$NOTES" | tr -d '[:space:]')" ] || NOTES="$(notes_for "Unreleased")"
          [ -n "$(printf %s "$NOTES" | tr -d '[:space:]')" ] || NOTES="Release $VERSION"
          printf '%s\n' "$NOTES" > release_notes.md
          printf '%s\n' "$NOTES" | awk '
            /^### / { if (l){print "</ul>"; l=0} s=$0; sub(/^### /,"",s); print "<b>" s "</b>"; next }
            /^- /   { if (!l){print "<ul>"; l=1} s=$0; sub(/^- /,"",s); print "<li>" s "</li>"; next }
            /^[[:space:]]*$/ { next }
            { if (l){print "</ul>"; l=0} print "<p>" $0 "</p>" }
            END { if (l) print "</ul>" }
          ' > release_notes.html
          echo "----- notes -----"; cat release_notes.md

      - name: Generate appcast.xml
        run: |
          set -euo pipefail
          DMG="${{ steps.dmg.outputs.dmg }}"
          URL="${{ github.server_url }}/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/${DMG}"
          PUBDATE="$(LC_ALL=C date -u '+%a, %d %b %Y %H:%M:%S +0000')"
          DESC_HTML="$(cat release_notes.html)"
          cat > appcast.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle" xmlns:dc="http://purl.org/dc/elements/1.1/">
            <channel>
              <title>Holocron</title>
              <link>${{ github.server_url }}/${{ github.repository }}</link>
              <description>Automatic updates for Holocron</description>
              <language>en</language>
              <item>
                <title>Version ${{ steps.version.outputs.version }}</title>
                <pubDate>${PUBDATE}</pubDate>
                <sparkle:version>${{ steps.version.outputs.build }}</sparkle:version>
                <sparkle:shortVersionString>${{ steps.version.outputs.version }}</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>15.0</sparkle:minimumSystemVersion>
                <description><![CDATA[
          ${DESC_HTML}
          ]]></description>
                <enclosure url="${URL}"
                           sparkle:edSignature="${{ steps.sign.outputs.edSignature }}"
                           length="${{ steps.sign.outputs.length }}"
                           type="application/octet-stream" />
              </item>
            </channel>
          </rss>
          EOF
          cat appcast.xml

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Holocron ${{ steps.version.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: |
            ${{ steps.dmg.outputs.dmg }}
            appcast.xml
