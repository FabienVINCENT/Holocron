name: Release

on:
  push:
    tags: ["v*"]
  # Manual release: creates the tag (via the release action) at the chosen
  # ref — useful when tags cannot be pushed directly.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

env:
  SPARKLE_VERSION: "2.6.4"

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (Release)
        run: |
          xcodebuild -project Holocron.xcodeproj \
            -scheme Holocron \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package DMG
        run: ./scripts/make-dmg.sh build/Build/Products/Release/Holocron.app dist

      # Auto-update signing is optional: without the SPARKLE_PRIVATE_KEY
      # secret the release still ships the DMG, just without appcast.xml
      # (no auto-updates for that version). See docs/RELEASE.md.
      - name: Sign update & generate appcast (if key configured)
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::warning::SPARKLE_PRIVATE_KEY secret not set — publishing DMG without appcast (no auto-update). See docs/RELEASE.md."
            exit 0
          fi
          curl -fsSL -o sparkle.tar.xz \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          mkdir -p sparkle-tools
          tar -xf sparkle.tar.xz -C sparkle-tools
          KEY_FILE=$(mktemp)
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$KEY_FILE"
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          ./sparkle-tools/bin/generate_appcast \
            --ed-key-file "$KEY_FILE" \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/" \
            dist/
          rm -f "$KEY_FILE"
          ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            dist/*.dmg
            dist/appcast.xml
          fail_on_unmatched_files: false
          generate_release_notes: true
